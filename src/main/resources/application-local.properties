# Local development: docker compose up -d (Postgres, Redis, Keycloak). See README.md.
spring.datasource.url=jdbc:postgresql://localhost:5434/ktoggle
spring.datasource.username=ktoggle
spring.datasource.password=ktoggle
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/ktoggle


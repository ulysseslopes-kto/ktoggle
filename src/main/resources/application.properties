spring.application.name=ktoggle
server.port=8090
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Persistence -------------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/ktoggle}
spring.datasource.username=${DATABASE_USERNAME:ktoggle}
spring.datasource.password=${DATABASE_PASSWORD:ktoggle}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- Redis (bundle activation fan-out between pods) --------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6390}
ktoggle.notifier=redis

# --- Security (Keycloak) -----------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mobilt}
ktoggle.cors.admin-origins=${KTOGGLE_ADMIN_ORIGINS:http://localhost:5173}

# --- Bundles -----------------------------------------------------------------------------------
# Signing: "local" (PEM key from config, dev/test) or "kms" (AWS KMS ECC_NIST_P256 key, stg/prd).
ktoggle.bundle.signing.provider=local
ktoggle.bundle.signing.kms-key-id=
ktoggle.bundle.signing.local-private-key=
ktoggle.bundle.signing.local-public-key=
ktoggle.bundle.signing.local-key-id=local-dev
ktoggle.bundle.archive.s3.enabled=false
ktoggle.bundle.archive.s3.bucket=
ktoggle.bundle.archive.s3.prefix=bundles/
ktoggle.bundle.archive.s3.retention-days=1825
ktoggle.bundle.reconcile-interval=PT1M
ktoggle.delivery.sync-interval=PT15S
ktoggle.delivery.log-flush-interval=PT1M

# --- Decision events (opt-in, LGPD-aware) ------------------------------------------------------
ktoggle.decisions.digest-key-id=k1
ktoggle.decisions.digest-secret=${KTOGGLE_DECISIONS_DIGEST_SECRET:}
ktoggle.decisions.queue-capacity=50000
ktoggle.decisions.batch-size=500
ktoggle.decisions.max-past-age=P7D
ktoggle.decisions.max-future-skew=PT5M

# --- Observability -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.info.git.mode=full
management.metrics.tags.application=${spring.application.name}
springdoc.swagger-ui.path=/swagger-ui.html

# Secrets come from AWS Secrets Manager only in deployed environments (stg/prd).

#---
spring.config.activate.on-profile=stg | prd
spring.config.import=optional:aws-secretsmanager:/secret/ktoggle

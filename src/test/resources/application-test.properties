# Tests run on an embedded PostgreSQL (zonky, real binaries, no Docker) — see @IntegrationTest.
spring.liquibase.enabled=true
ktoggle.notifier=local
ktoggle.scheduling.enabled=false
management.health.redis.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:0/realms/test
ktoggle.decisions.digest-secret=dGVzdC1zZWNyZXQtZm9yLWF0dHJpYnV0ZS1kaWdlc3Rz
logging.level.com.ktogroup.ktoggle=INFO

# No AWS outside stg/prd: Secrets Manager is off and a static region avoids SDK region discovery.
spring.cloud.aws.secretsmanager.enabled=false
spring.cloud.aws.region.static=sa-east-1
